name: Events Demo 1
on:
  pull_request:
    types: # opened # accepts multiple values too. Ex: Array or list type declaration
      - opened
  workflow_dispatch: # even though there are no arguments we should still declare in this way
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: echo "${{ toJSON(github.event) }}"
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Test code
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Deploy project
        run: echo "Deploying..."