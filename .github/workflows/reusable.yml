name: Reusable Deploy
on: 
  workflow_call:
    # As this yml file is being used on another yml file call if we are expecting any inputs from the parent file we need to declare what kind of files expecting from the parent yml file
    inputs:
      artifact-name:
        description: The name of the deployable artifact files
        required: false
        default: dist
        type: string
    # secrets:
    #   some-secret:
    #     required: true
    outputs:
      result:
        description: The result of the deployment operation
        value: ${{ jobs.deploy.outputs.outcome }}
jobs:
  deploy:
    outputs:
      outcome: ${{ steps.set-result.outputs.step-result }}
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }} # accessing files dynamically from the parent yml file
      - name: List files
        run: ls
      - name: Output information
        run: echo "Deploying & uploading..."
      - name: Set result outputs
        run: echo "::set-output name=step-result::success"