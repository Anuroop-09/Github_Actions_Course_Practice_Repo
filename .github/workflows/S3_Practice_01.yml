name: "Section 03 Practice Project Workflow 01"
on: push
jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name:
        uses: actions/checkout@v6
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Lint run status
        run: echo "Lint run successful!"
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name:
        uses: actions/checkout@v6
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run Tests
        run: npm test
  deploy-job:
    runs-on: ubuntu-latest
    steps:
      - name:
        uses: actions/checkout@v6
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build Project
        run: npm run build
      - name: Deploy
        run: echo "Deploying ...."