name: Matrix Deployment
on: push
jobs:
  build:
    continue-on-error: true
    # running tests in multiple values or specifications
    strategy:
      matrix:
        node-version: [18, 20, 22]
        operating-system: [ubuntu-latest, windows-latest]
        include: # stand alone combinations only
          - node-version: 18
          - operating-system: ubuntu-latest
        exclude: # exlcude the combinations
          - node-version: 12
            operating-system: ubuntu-latest
    runs-on: ${{ matrix.operating-system }} # runs on all the listed versions / values. The versions will run in parallel
    steps:
      - name: Get code
        uses: actions/checkout@v6
      - name: Install NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build