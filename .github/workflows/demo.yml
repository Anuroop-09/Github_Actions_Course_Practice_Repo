# Upload artifacts: https://github.com/actions/upload-artifact
# Download artifacts: https://github.com/actions/download-artifact

name: Deploy website
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v6
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Test code
        run: npm run test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v6
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-name # user choice for naming
          path: dist
          # path: |
          #   dist
          #   package.json
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v7 # Downloads the artifacts uploaded by the previous version
        with:
          name: dist-name # Same name for upload artifacts should be used here. And multiple artifacts can't downloaded or used at once
      - name: Output contents
        run: ls
      - name: Deploy
        run: echo "Deploying..."
