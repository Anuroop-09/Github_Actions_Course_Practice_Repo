name: "Section 03 Practice Project Workflow 01 Single Job"
on: workflow_dispatch
jobs:
  single-job:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v6
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Lint run status
        run: echo "Lint run successful!"
      - name: Run Tests
        run: npm test
      - name: Build Project
        run: npm run build
      - name: Deploy
        run: echo "Deploying ...."